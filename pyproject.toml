[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-agent"
version = "1.5.2"
description = "The world's most powerful free AI agent. Self-evolving. Zero cost. Forever."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "TREN Studio", email = "hello@trenstudio.com"}]
keywords = ["ai", "agent", "llm", "free", "open-source", "forge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
    "pydantic>=2.6",
    "sqlmodel>=0.0.18",
    "aiohttp>=3.9",
    "tenacity>=8.3",
    "diskcache>=5.6",
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
    "colorama>=0.4",
    "cryptography>=42",
]

[project.optional-dependencies]
tools = ["playwright>=1.44", "beautifulsoup4>=4.12", "duckduckgo-search>=6.2"]
research = ["pytrends>=4.9", "beautifulsoup4>=4.12", "lxml>=5.0"]
dev   = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
forge = "forge.cli.main:cli"

[project.urls]
Homepage   = "https://www.trenstudio.com/FORGE"
Repository = "https://github.com/TREN-Studio/FORGE"
Issues     = "https://github.com/TREN-Studio/FORGE/issues"

[tool.setuptools.packages.find]
include = ["forge*", "site_backend*"]
exclude = ["assets*", "installer*", "output*", "site*", "site_external*", "tests*", "tools*"]

[tool.setuptools.package-data]
forge = [
    "skills_catalog/*/schema.json",
    "skills_catalog/*/SKILL.md",
    "skills_catalog/*/executor.py",
    "skills_catalog/_template/SKILL.md",
]

[tool.setuptools.exclude-package-data]
forge = [
    "skills_catalog/**/__pycache__/*",
    "skills_catalog/**/*.pyc",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501", "B008", "C401", "C408", "SIM105", "RUF012",
    # Style/typographic lint (non-functional): unicode chars in docstrings/comments,
    # and refactor suggestions that don't change behaviour. Gated separately so
    # `ruff check` stays focused on real correctness issues.
    "RUF001", "RUF002", "RUF003", "RUF005",
    "SIM102", "SIM103", "SIM112", "SIM117",
    "B007", "B904",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "UP"]
"forge/skills_catalog/*" = ["B", "F401", "F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
warn_return_any = false
no_implicit_optional = true
# FORGE adopts static typing incrementally. These error codes are the noisiest
# and do not indicate runtime bugs, so they are downgraded while the team
# tightens type coverage module-by-module. `arg-type`, `return-value`,
# `attr-defined` and `str-bytes-safe` remain ON as hard gates.
disable_error_code = ["union-attr", "no-redef", "misc", "var-annotated", "assignment"]
exclude = [
    "forge/skills_catalog/",
    "node_modules/",
    ".build-dist/",
    ".build-work/",
    "site/",
    "site_backend/",
]

[[tool.mypy.overrides]]
module = "forge.skills_catalog.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --cov=forge --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
branch = true
omit = [
    "forge/skills_catalog/*",
    "site_backend/*",
    "tests/*",
    "**/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
